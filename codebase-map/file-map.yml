files:
  - file: layout/password.liquid
    responsibility: Provides the minimal HTML layout wrapper for the password-protected storefront page when the store is locked
    owns:
      - HTML document structure for password page
      - Head section with CSS variables and critical styles
      - Meta tags and social sharing tags for password page
      - Body wrapper that delegates content rendering to password.json template
    depends_on:
      js: []
      snippets:
        - css-variables
        - meta-tags
      sections: []
      global_objects:
        - request.locale.iso_code
        - content_for_header
        - content_for_layout
      custom_elements: []
    depended_on_by:
      - templates/password.json
      - sections/password.liquid
    key_identifiers:
      css_classes: []
      data_attributes: []
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - none
    common_mistakes:
      - Adding header/footer sections here (they won't work on password page)
      - Expecting this to render when store is not password-protected
      - Forgetting that content_for_layout renders the template defined in templates/password.json
      - Adding interactive JavaScript without including required libraries
      - Not understanding this is completely separate from layout/theme.liquid
    fix_guidance: Check templates/password.json to see which section is being rendered via content_for_layout; verify store
      is actually password-protected in Shopify admin to see this layout; ensure css-variables and meta-tags snippets
      are working correctly
  - file: layout/theme.liquid
    responsibility: Defines the main HTML document structure and orchestrates global assets, scripts, and sections for all
      non-password pages
    owns:
      - HTML doctype and head configuration
      - Global meta tags and SEO elements
      - Font preconnect links for custom fonts
      - Critical CSS loading and CSS variables injection
      - Alpine.js framework initialization
      - Swiper library conditional loading
      - liquid-ajax-cart initialization and cart state
      - Skip to content accessibility link
      - Header and footer section groups rendering
      - Main content layout wrapper
    depends_on:
      js:
        - assets/alpinejs-persist@3.14.8.min.js
        - assets/alpinejs@3.14.8.min.js
        - assets/theme.js
        - assets/liquid-ajax-cart-v2.1.1.js
        - assets/swiper7.4.1.min.js
        - assets/component-predictive-search.js
        - assets/component-splash-screen.js
      snippets:
        - snippets/component-gtm-head.liquid
        - snippets/component-gtm-body.liquid
        - snippets/component-splash-screen-head.liquid
        - snippets/component-splash-screen.liquid
        - snippets/css-variables.liquid
        - snippets/meta-tags.liquid
        - snippets/component-data-layer.liquid
      sections:
        - sections/header-group.json
        - sections/footer-group.json
      global_objects:
        - request.locale
        - canonical_url
        - settings
        - page_description
        - content_for_header
        - content_for_layout
        - template
        - cart
      custom_elements: []
    depended_on_by:
      - All non-password page templates that use this layout
      - Template JSON files that render through this layout wrapper
      - All sections that expect Alpine.js availability
      - Components relying on liquid-ajax-cart for cart functionality
    key_identifiers:
      css_classes:
        - skip-to-content-link
        - visually-hidden
        - content-for-layout
      data_attributes:
        - data-ajax-cart-initial-state
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - Initial cart state JSON for liquid-ajax-cart
      - Alpine.js global framework availability
      - Swiper library availability for specific templates
      - Splash screen visibility state
    common_mistakes:
      - Adding section-specific CSS/JS here instead of in section files
      - Not checking template.name before conditionally loading Swiper
      - Forgetting that changes affect all pages except password page
      - Modifying script loading order breaking Alpine.js or liquid-ajax-cart dependencies
      - Adding blocking scripts that delay page rendering
    fix_guidance: Check this file when global assets fail to load, Alpine.js components don't initialize, cart functionality
      breaks, or fonts/favicon don't appear; verify script defer attributes and loading order for framework dependencies
  - file: sections/404.liquid
    responsibility: Renders the 404 error page with styled message and continue shopping button
    owns:
      - 404 error page layout and styling
      - Error message display with translation support
      - Continue shopping call-to-action button
      - Responsive design for mobile/desktop views
      - Color scheme configuration via section settings
    depends_on:
      js: []
      snippets: []
      sections: []
      global_objects:
        - routes.all_products_collection_url
        - section.settings.color_scheme
      custom_elements: []
    depended_on_by:
      - templates/404.json
    key_identifiers:
