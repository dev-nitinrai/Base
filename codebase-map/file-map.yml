files:
  - file: layout/password.liquid
    responsibility: Provides the minimal HTML layout wrapper for the password-protected storefront page before store launch
    owns:
      - HTML document structure for password page only
      - Head section with CSS variables and critical CSS loading
      - Meta tags and social sharing configuration for password page
      - Content placeholder rendering via content_for_layout
    depends_on:
      js: []
      snippets:
        - snippets/css-variables.liquid
        - snippets/meta-tags.liquid
      sections: []
      global_objects:
        - request.locale.iso_code
        - content_for_header
        - content_for_layout
      custom_elements: []
    depended_on_by:
      - templates/password.json
      - sections/password.liquid
    key_identifiers:
      css_classes: []
      data_attributes: []
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - none
    common_mistakes:
      - Confusing this with layout/theme.liquid which is the main store layout
      - Adding full site navigation or header/footer elements meant for the main theme
      - Attempting to load Alpine.js or theme.js assets that are only needed in the main store
      - Forgetting this is only rendered when the store is password-protected
      - Modifying this file when changes should be made to layout/theme.liquid instead
    fix_guidance: Check templates/password.json to see what section is being rendered through content_for_layout, and verify
      the store is actually password-protected when testing changes
  - file: layout/theme.liquid
    responsibility: Root HTML layout wrapper that defines the document structure, loads global assets, and orchestrates
      header/footer sections for all non-password pages
    owns:
      - Document <html> and <head> structure with meta tags and SEO
      - Global CSS and JavaScript asset loading order
      - Alpine.js initialization and persistence setup
      - Swiper library conditional loading for specific templates
      - liquid-ajax-cart initialization with cart state
      - GTM/analytics integration via component renders
      - Splash screen conditional rendering
      - Skip-to-content accessibility link
      - Main content wrapper (#MainContent)
      - Header and footer section groups orchestration
    depends_on:
      js:
        - assets/alpinejs-persist@3.14.8.min.js
        - assets/alpinejs@3.14.8.min.js
        - assets/theme.js
        - assets/liquid-ajax-cart-v2.1.1.js
        - assets/swiper7.4.1.min.js
        - assets/component-predictive-search.js
        - assets/component-splash-screen.js
      snippets:
        - snippets/component-gtm-head.liquid
        - snippets/component-gtm-body.liquid
        - snippets/component-data-layer.liquid
        - snippets/css-variables.liquid
        - snippets/component-splash-screen-head.liquid
        - snippets/component-splash-screen.liquid
        - snippets/meta-tags.liquid
      sections:
        - sections/header-group.json
        - sections/footer-group.json
      global_objects:
        - request.locale.iso_code
        - canonical_url
        - settings (favicon, fonts, splash_screen_enabled, predictive_search_enabled)
        - page_description
        - content_for_header
        - content_for_layout
        - template.name
        - cart
      custom_elements: []
    depended_on_by:
      - All Shopify pages except password.liquid (which uses layout/password.liquid)
      - All section files that rely on Alpine.js, Swiper, or liquid-ajax-cart being loaded
      - Template JSON files that assume header-group and footer-group sections are available
    key_identifiers:
      css_classes:
        - skip-to-content-link
        - visually-hidden
        - content-for-layout
      data_attributes:
        - data-ajax-cart-initial-state
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - Initial cart state via liquid-ajax-cart JSON initialization
      - Alpine.js global store initialization via persist plugin
      - Document-level theme color and viewport configuration
    common_mistakes:
      - Adding new JavaScript libraries without considering load order relative to Alpine.js and theme.js
      - Forgetting that Swiper is conditionally loaded only for specific templates (collection, product, index, page,
        search)
      - Not recognizing that settings.predictive_search_enabled gates both CSS and JS loading
      - Attempting to use Alpine.js features before Alpine is initialized (defer attribute)
      - Assuming all assets are loaded on all pages (many are conditional)
      - Modifying asset loading order without understanding Alpine.js must load before theme.js
    fix_guidance: Check conditional asset loading logic (template.name checks, settings flags) if features are missing on
      certain pages; verify Alpine.js initialization timing if reactive features fail; confirm liquid-ajax-cart initial
      state JSON is valid if cart functionality breaks
  - file: sections/404.liquid
    error: parse_failed
  - file: sections/Faq.liquid
    responsibility: Renders an accordion-style FAQ section with expandable question/answer blocks using Alpine.js for state management
    owns:
      - FAQ section layout with heading and collapsible accordion items
      - Alpine.js reactive state for controlling which FAQ block is open (openBlock)
      - Dynamic CSS scoping via section.id for padding customization
      - FAQ block rendering loop with question/answer pairs
      - Plus/minus icon toggle based on expanded state
    depends_on:
      js:
        - assets/alpinejs@3.14.8.min.js
      snippets: []
      sections: []
      global_objects:
        - section.settings (title, color_scheme, padding_top, padding_bottom)
        - section.blocks (question, answer)
        - section.id
      custom_elements: []
      assets:
        - assets/section-faq.css
        - icon-plus.svg
        - icon-minus.svg
    depended_on_by:
      - templates/page.json or other templates that include FAQ sections
      - Shopify theme customizer for FAQ section configuration
    key_identifiers:
      css_classes:
        - faq-section
        - faq__heading
        - faq__container
        - faq__block
        - faq__accordion
        - faq__header
        - faq__title
        - faq__icon
        - faq__content
        - faq__content-wrapper
        - faq__answer
        - section-{{ section.id }}-padding
        - color-{{ section.settings.color_scheme }}
      data_attributes:
        - x-data="{ openBlock: null }"
        - x-show
        - x-transition
        - x-cloak
        - "@click"
        - :aria-expanded
      js_events_emitted: []
      js_events_listened:
        - click (on faq__header button)
      custom_elements: []
    state_ownership:
      - Alpine.js openBlock state (tracks which FAQ item is expanded by index, null when all closed)
      - Only one FAQ item can be open at a time (accordion behavior)
    common_mistakes:
      - Forgetting that Alpine.js must be loaded globally for x-data/x-show directives to work
      - Not understanding that openBlock uses forloop.index0 (zero-based) for comparison
      - Removing x-cloak without ensuring Alpine.js loads, causing FOUC (flash of unstyled content)
      - Modifying the click handler without preserving the toggle logic (openBlock === index ? null: index)
      - Assuming multiple FAQs can be open simultaneously (current implementation only allows one)
    fix_guidance: Check that assets/section-faq.css exists and Alpine.js is loaded in theme.liquid; verify block settings
      have question/answer fields populated; inspect browser console for Alpine.js errors if accordions don't toggle
  - file: sections/account.liquid
    responsibility: Customer account dashboard displaying order history with pagination and logout functionality
    owns:
      - Customer account page layout and structure
      - Order history table with order number, date, payment status, fulfillment status, and total
      - Pagination controls for orders (20 per page)
      - Logout link with account icon
      - Dynamic padding based on section settings
      - Color scheme application from section settings
    depends_on:
      js: []
      snippets: []
      sections: []
      global_objects:
        - customer
        - customer.orders
        - routes.account_logout_url
        - paginate
      custom_elements: []
    depended_on_by:
      - templates/customers/account.json
    key_identifiers:
      css_classes:
        - customer
        - account
        - section-{{ section.id }}-padding
        - page-width
        - customer__title
        - svg-wrapper
        - order-history
        - visually-hidden
        - pagination
        - color-{{ section.settings.color_scheme }}
      data_attributes:
        - data-label
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - Section padding settings (padding_top, padding_bottom)
      - Color scheme selection
      - Customer orders pagination state (page 1-N)
    common_mistakes:
      - Assuming JavaScript is needed for pagination (it's server-side via Liquid paginate tag)
      - Modifying table structure without updating ARIA roles and headers associations
      - Changing pagination limit from 20 without considering performance implications
      - Not maintaining responsive data-label attributes when modifying table columns
    fix_guidance: Check customer.css asset for styling issues; verify customer object availability and shop customer account
      settings; ensure pagination logic respects the "paginate by 20" parameter; validate translation keys in locales
      files for missing text
  - file: sections/activate-account.liquid
    responsibility: Renders the customer account activation form where new customers set their password
    owns:
      - Account activation form UI with password and password confirmation fields
      - Form validation error display for activation form
      - Submit and decline buttons for account activation
      - Section-specific padding styles
      - Integration with Shopify's activate_customer_password form
    depends_on:
