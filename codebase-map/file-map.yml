      style tag; ensure image_1 through image_4 settings exist with proper naming convention
  - file: sections/announcement-bar.liquid
    responsibility: Displays a rotating, auto-scrolling announcement bar with customizable messages, links, and emojis at
      the top of the site
    owns:
      - Announcement bar section UI and styling
      - Multiple announcement message rotation logic using Alpine.js
      - Auto-scroll interval management with pause on hover/focus
      - Previous/next navigation arrows for manual message cycling
      - Mobile-responsive layout that hides navigation arrows
      - Color customization via section settings (background and text colors)
    depends_on:
      js:
        - assets/alpinejs@3.14.8.min.js
      snippets: []
      sections: []
      global_objects:
        - section.settings (background_color, text_color, show_announcement, auto_rotate_interval)
        - section.blocks (announcement messages with text, link_url, link_text, emoji)
      custom_elements: []
    depended_on_by:
      - layout/theme.liquid (likely included in header-group.json)
      - sections/header-group.json (announcement bar typically grouped with header)
    key_identifiers:
      css_classes:
        - announcement-bar-section
        - announcement-bar
        - announcement-bar__content
        - announcement-bar__arrow
        - announcement-bar__arrow--prev
        - announcement-bar__arrow--next
        - announcement-bar__message
        - announcement-bar__link
        - announcement-bar__emoji
        - fade-in
      data_attributes: []
      js_events_emitted: []
      js_events_listened:
        - mouseenter
        - mouseleave
        - focusin
        - focusout
        - click
      custom_elements: []
    state_ownership:
      - Alpine.js reactive state (idx - current announcement index, total - total announcements, interval - setInterval
        reference)
      - Auto-rotation timer state with start/stop methods
    common_mistakes:
      - Forgetting that auto_rotate_interval is in seconds but needs conversion to milliseconds
      - Not accounting for single announcement block where navigation arrows should be hidden
      - Missing that Alpine.js is required for this section to function
      - Assuming arrows are visible on mobile when they are hidden via CSS media queries
      - Not realizing that hover/focus stops auto-rotation and requires re-triggering on mouse leave
    fix_guidance: Check Alpine.js x-data initialization for rotation logic, verify section.settings.auto_rotate_interval
      exists and has valid value, ensure section.blocks array has content, check CSS for .announcement-bar__arrow
      display rules on mobile breakpoints
