      - Card flip state managed by section-animated-features.js custom element
      - Animation timing state via CSS custom properties (--animation-speed, --card-animation-speed, --card-flip-speed)
    common_mistakes:
      - Forgetting that animation speeds are calculated dynamically (card-animation-speed is 83% of base, flip-speed is
        50%)
      - Not realizing there's a v2 version (animated-features-v2.liquid) that may have different functionality
      - Assuming more than 4 cards are supported (hardcoded loop for 1..4)
      - Missing that flipped_text fields accept HTML content not just plain text
      - Forgetting placeholder SVG renders when image is blank
    fix_guidance: Check section-animated-features.js for card flip interaction logic; verify CSS custom properties are
      correctly calculated; ensure all 4 card settings (image_N, label_N, flipped_text_N) are properly configured in
      schema; compare with animated-features-v2.liquid if feature mismatch occurs
