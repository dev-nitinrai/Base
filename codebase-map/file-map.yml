    responsibility: Renders a rotating announcement bar at the top of the site with customizable messages, links, and emojis
    owns:
      - Announcement bar carousel with multiple message blocks
      - Auto-rotation logic with configurable interval
      - Previous/next navigation arrows for manual control
      - Pause-on-hover/focus functionality
      - Styling for text, background, links, and emoji display
      - Responsive layout adapting from desktop to mobile
    depends_on:
