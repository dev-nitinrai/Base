    state_ownership:
      - Animation timing via CSS custom properties (--animation-speed, --digit-animation-speed)
      - Feature visibility based on loop iteration (1..4)
      - Image display state (loaded image vs placeholder)
    common_mistakes:
      - Forgetting that feature loop only supports 4 features maximum (hardcoded range)
      - Not realizing --digit-animation-speed is automatically 1.5x the base animation speed
      - Assuming the image_label renders even when image is blank (it only shows when image exists)
      - Missing that animation_speed defaults to 1.2 seconds if not set
      - Not accounting for 75% padding reduction on mobile breakpoint
    fix_guidance: Check section-animated-features-v2.js for actual animation implementation logic and
      section-animated-features-v2.css for styling and responsive behavior; verify schema settings match expected data
      types in settings_data.json
