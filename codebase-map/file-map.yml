  - file: assets/section-what-shade.js
    responsibility: Drives all client-side interactivity for the 'What Shade Am I?' section, including view toggling
      (swatches/models), filter pill state, carousel navigation, DOM reordering of filtered cards, and responsive
      per-view recalculation.
    owns:
      - "[data-what-shade] section root initialization"
      - View toggle (swatches vs models) aria and CSS class state
      - Filter pill active state and aria-pressed management
      - Carousel index, track transform updates, and chevron enable/disable logic
      - Card visibility filtering via data-usage and data-tone attributes
      - DOM reordering of cards after filter application
      - Empty state ([data-empty]) show/hide
      - Responsive perView computation (1 mobile / 4 desktop)
      - Debounced resize handler
    depends_on:
      js: []
      snippets: []
      sections:
        - sections/product.liquid
        - sections/featured-products.liquid
    common_mistakes:
      - Assuming the section liquid file is named new-section.liquid per the comment header rather than recognizing it
        targets any section rendering [data-what-shade]
      - Missing that applyFilters physically reorders DOM nodes inside the track, so any external code referencing card
        indices by DOM position will get stale results after filtering
      - Overlooking the truncated carouselEl.setAttribut call which is incomplete and will throw a runtime TypeError if
        carouselEl exists
      - Assuming perView is static; it recomputes on resize and resets index to 0, which can surprise agents patching
        carousel logic
      - Conflating data-usage (comma-separated list) with data-tone (single value) when writing filter logic patches
      - Not accounting for hidden cards still being present in the DOM track after filtering, only moved to the end
    fix_guidance: Start with the truncated carouselEl.setAttribut line (likely setAttribute missing arguments) then verify
      data-what-shade is present on the section root element in the corresponding liquid file before debugging any
      interaction failures.
