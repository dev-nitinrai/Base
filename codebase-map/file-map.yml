      data_attributes:
        - data-section-id
        - data-animation-speed
        - data-percentage
      js_events_emitted: []
      js_events_listened: []
      custom_elements:
        - animated-features-v2
    state_ownership:
      - Animation speed configuration via CSS variables (--animation-speed, --digit-animation-speed)
      - Section padding based on viewport size
      - Feature visibility based on whether feature_1 through feature_4 settings are populated
    common_mistakes:
      - Forgetting that animation speed for digits is automatically 1.5x the base animation_speed
      - Not accounting for the loop that only renders 4 features maximum (features beyond feature_4 are ignored)
      - Assuming image_label displays without checking if it's blank
      - Overlooking that mobile padding is 0.75x of desktop padding
    fix_guidance: Check section-animated-features-v2.js for animation logic issues; verify CSS variables are properly set in
      inline style block; ensure feature loop correctly accesses section.settings with dynamic keys
  - file: sections/animated-features.liquid
    responsibility: Renders an animated features section with a 2x2 grid of flippable cards on the right and heading/CTA
