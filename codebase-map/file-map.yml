      data_attributes:
        - data-section-id
        - data-animation-speed
      js_events_emitted: []
      js_events_listened: []
      custom_elements:
        - animated-features
    state_ownership:
      - Card flip state managed by section-animated-features.js
      - Animation timing controlled via CSS variables (--animation-speed, --card-animation-speed, --card-flip-speed)
      - Color scheme and button styling via inline CSS variables
    common_mistakes:
      - Forgetting that card animation speeds are calculated as multipliers of animation_speed setting
      - Not realizing there are exactly 4 cards hardcoded in the loop (1..4)
      - Assuming cards can be dynamically added/removed (they cannot without schema changes)
      - Overlooking that flipped_text uses default fallback text if not set
      - Missing that button color uses dynamic CSS variable mapping from button_type setting
    fix_guidance: Check section-animated-features.js for flip animation logic and CSS file for card transform styles; verify
      schema settings for image_1-4, label_1-4, and flipped_text_1-4 fields
  - file: sections/announcement-bar.liquid
    responsibility: Displays a rotating announcement bar with customizable messages, links, and emojis at the top of the page
    owns:
      - Announcement bar section rendering and styling
      - Multi-message carousel with manual and auto-rotation
      - Alpine.js-based state management for current message index
      - Navigation arrows for cycling through announcements
      - Auto-scroll interval with pause on hover/focus
      - Responsive design for mobile devices
    depends_on:
      js:
        - assets/alpinejs@3.14.8.min.js
      snippets: []
      sections: []
      global_objects:
        - section.settings.show_announcement
        - section.settings.background_color
        - section.settings.text_color
        - section.settings.auto_rotate_interval
        - section.blocks
      custom_elements: []
    depended_on_by:
      - layout/theme.liquid
      - sections/header-group.json
      - Theme customizer settings
    key_identifiers:
      css_classes:
        - announcement-bar-section
        - announcement-bar
        - announcement-bar__content
        - announcement-bar__message
        - announcement-bar__arrow
        - announcement-bar__link
        - announcement-bar__emoji
        - fade-in
      data_attributes: []
      js_events_emitted: []
      js_events_listened:
        - mouseenter
        - mouseleave
        - focusin
        - focusout
        - click
      custom_elements: []
    state_ownership:
      - Current announcement index (idx)
      - Total announcement count (total)
      - Auto-scroll interval timer (interval)
    common_mistakes:
      - Forgetting that Alpine.js must be loaded before this section renders
      - Not accounting for section.blocks.size being zero when show_announcement is true
      - Modifying the auto_rotate_interval without considering it's converted to milliseconds
      - Breaking the x-show/x-transition logic by adding conflicting display styles
      - Not preserving the block.shopify_attributes for theme editor functionality
    fix_guidance: Check Alpine.js initialization state if carousel doesn't work; verify section.blocks array has content;
      inspect auto_rotate_interval setting if rotation timing is wrong; check CSS z-index if arrows are not clickable
