      - sections/header-group.json
    key_identifiers:
      css_classes:
        - announcement-bar-section
        - announcement-bar
        - announcement-bar__content
        - announcement-bar__arrow
        - announcement-bar__arrow--prev
        - announcement-bar__arrow--next
        - announcement-bar__message
        - announcement-bar__link
        - announcement-bar__emoji
        - fade-in
      data_attributes: []
      js_events_emitted: []
      js_events_listened:
        - "@click"
        - "@mouseenter"
        - "@mouseleave"
        - "@focusin"
        - "@focusout"
      custom_elements: []
    state_ownership:
      - Alpine.js idx counter for current announcement block
      - Alpine.js total count of blocks
      - Alpine.js interval reference for auto-rotation timer
      - Auto-rotation state (running/paused)
    common_mistakes:
      - Modifying the Alpine.js data structure without updating all three methods (startAutoScroll, stopAutoScroll,
        navigation)
      - Changing block iteration without updating forloop.index0 references in x-show directives
      - Breaking the pause-on-hover by removing or mismatching event listeners
      - Hardcoding colors instead of using section.settings variables
      - Removing the conditional check for section.blocks.size > 1 which hides arrows for single announcements
    fix_guidance: Check Alpine.js x-data initialization and ensure auto_rotate_interval setting exists; verify
      section.blocks are populated and visible blocks have proper x-show index matching; inspect CSS for display issues
      at different breakpoints
