files:
  - file: layout/password.liquid
    responsibility: Defines the minimal HTML structure for the password-protected storefront page before store is launched
    owns:
      - Basic HTML document structure for password page
      - CSS variables and critical CSS loading for password page
      - Meta tags and header content for password page
      - Body container for password-specific content
    depends_on:
      js: []
      snippets:
        - css-variables.liquid
        - meta-tags.liquid
      sections:
        - sections/password.liquid (rendered via content_for_layout)
      global_objects:
        - request.locale.iso_code
        - content_for_header
        - content_for_layout
      custom_elements: []
    depended_on_by:
      - templates/password.json (uses this layout)
      - Shopify core rendering system when store is password-protected
    key_identifiers:
      css_classes: []
      data_attributes: []
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - none
    common_mistakes:
      - Confusing this with layout/theme.liquid (main store layout)
      - Attempting to add full navigation or store features here
      - Not understanding this is only active when store is password-protected
      - Forgetting that content_for_layout renders sections/password.liquid
      - Adding unnecessary complexity when this should remain minimal
    fix_guidance: When password page issues occur, check if critical.css is loading properly, verify css-variables snippet
      is working, and ensure sections/password.liquid is properly configured in templates/password.json
  - file: layout/theme.liquid
    responsibility: Main HTML layout wrapper that loads global assets, Alpine.js, cart functionality, and renders
      header/footer section groups
    owns:
      - HTML document structure and meta tags
      - Global CSS variables via css-variables snippet
      - Alpine.js initialization (3.14.8 with persist plugin)
      - Liquid Ajax Cart integration and initial state
      - Swiper.js conditional loading for specific templates
      - GTM (Google Tag Manager) integration
      - Predictive search conditional loading
      - Splash screen conditional rendering
      - Skip-to-content accessibility link
    depended_on_by:
      - All page templates that use theme.liquid as their layout
      - All sections that rely on Alpine.js being available
      - Cart functionality throughout the site
      - Header and footer section groups
    depends_on:
      js:
        - assets/alpinejs-persist@3.14.8.min.js
        - assets/alpinejs@3.14.8.min.js
        - assets/theme.js
        - assets/liquid-ajax-cart-v2.1.1.js
        - assets/swiper7.4.1.min.js
        - assets/component-predictive-search.js
        - assets/component-splash-screen.js
      snippets:
        - snippets/component-gtm-head.liquid
        - snippets/component-gtm-body.liquid
        - snippets/component-data-layer.liquid
        - snippets/css-variables.liquid
        - snippets/meta-tags.liquid
        - snippets/component-splash-screen-head.liquid
        - snippets/component-splash-screen.liquid
      sections:
        - sections/header-group.json
        - sections/footer-group.json
      global_objects:
        - request.locale.iso_code
        - canonical_url
        - settings (favicon, fonts, splash_screen_enabled, predictive_search_enabled)
        - page_description
        - content_for_header
        - content_for_layout
        - cart
        - template.name
      custom_elements: []
    key_identifiers:
      css_classes:
        - skip-to-content-link
        - visually-hidden
        - content-for-layout
      data_attributes:
        - data-ajax-cart-initial-state
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - Cart initial state JSON (data-ajax-cart-initial-state)
      - Alpine.js global state management via persist plugin
    common_mistakes:
      - Adding scripts without proper defer/type="module" attributes causing load order issues
      - Forgetting that Swiper is only loaded on specific templates (collection, product, index, page, search)
      - Modifying CSS variable rendering without checking css-variables snippet
      - Not accounting for conditional features (splash screen, predictive search) being disabled in settings
      - Adding assets without considering critical CSS is preloaded separately
    fix_guidance: Check settings_schema.json for feature toggles (splash_screen_enabled, predictive_search_enabled); verify
      Alpine.js and liquid-ajax-cart are loading before dependent components; ensure Swiper-dependent sections check
      template.name before initializing
  - file: sections/404.liquid
    responsibility: Renders the 404 error page with centered layout, error message, and continue shopping button
    owns:
      - 404 error page layout and styling
      - Error message display using translation keys
      - Continue shopping button linking to all products collection
      - Inline CSS for .template-404 styling
      - Color scheme customization through section settings
    depends_on:
      js: []
      snippets: []
      sections: []
      global_objects:
        - routes.all_products_collection_url
        - section.settings.color_scheme
      custom_elements: []
      translation_keys:
        - templates.404.subtext
        - templates.404.title
        - general.continue_shopping
    depended_on_by:
      - templates/404.json
    key_identifiers:
      css_classes:
        - template-404
        - page-width
        - title
        - button
        - color-{{ section.settings.color_scheme }}
      data_attributes: []
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - none
    common_mistakes:
      - Modifying inline styles without updating responsive breakpoints at 768px
      - Removing the page-width class which may break layout consistency with other pages
      - Changing button link from routes.all_products_collection_url without considering alternative navigation
      - Not maintaining translation keys when customizing text content
    fix_guidance: Check translation files (locales/en.default.json) if text not displaying, verify routes object is
      available in Shopify context, ensure color scheme setting matches available schemes in settings_schema.json
  - file: sections/Faq.liquid
    responsibility: Renders an accordion-style FAQ section with expandable/collapsible question-answer blocks using Alpine.js
    owns:
      - FAQ accordion UI with expand/collapse functionality
      - Dynamic inline padding styles based on section settings
      - Per-block question and answer rendering
      - Plus/minus icon toggle states
      - Color scheme application via section settings
    depends_on:
      js:
        - assets/alpinejs@3.14.8.min.js
      snippets: []
      sections: []
      global_objects:
        - section.settings
        - section.blocks
        - block.settings
        - block.shopify_attributes
      custom_elements: []
      assets:
        - assets/section-faq.css
        - icon-plus.svg
        - icon-minus.svg
    depended_on_by:
      - templates/page.faq.json
    common_mistakes:
      - Forgetting that Alpine.js must be loaded globally for x-data, x-show, x-transition, and x-cloak to work
      - Not understanding that openBlock state tracks which accordion is open by comparing to forloop.index0
      - Assuming multiple accordions can be open simultaneously (current implementation allows only one open at a time)
      - Modifying the forloop.index0 comparison without updating both the button click handler and the x-show conditions
      - Removing x-cloak without ensuring Alpine.js has loaded to prevent flash of unstyled content
    key_identifiers:
      css_classes:
        - faq-section
        - section-{{ section.id }}-padding
        - color-{{ section.settings.color_scheme }}
        - faq__container
        - faq__block
        - faq__accordion
        - faq__header
        - faq__title
        - faq__icon
        - faq__content
        - faq__content-wrapper
        - faq__answer
        - faq__heading
      data_attributes:
        - x-data="{ openBlock: null }"
        - x-show
        - x-transition
        - x-cloak
        - "@click"
        - :aria-expanded
      js_events_emitted: []
      js_events_listened:
        - click (via Alpine.js @click on accordion buttons)
      custom_elements: []
    state_ownership:
      - openBlock (Alpine.js reactive state tracking which FAQ item is currently expanded, stored at container level)
    fix_guidance: Check Alpine.js is loaded in layout/theme.liquid; verify section-faq.css exists and styles accordion
      states; ensure forloop.index0 values are consistent between button @click and content x-show
  - file: sections/account.liquid
    responsibility: Renders the customer account dashboard displaying order history and account information
    owns:
      - Customer account page layout and structure
      - Order history table with pagination
      - Logout link with account icon
      - Responsive padding based on section settings
      - Color scheme application from section settings
      - Empty state message when no orders exist
    depends_on:
      js: []
      snippets: []
      sections: []
      global_objects:
        - customer
        - customer.orders
        - routes.account_logout_url
        - paginate
      custom_elements: []
    depended_on_by:
      - templates/customers/account.json
    key_identifiers:
      css_classes:
        - customer
        - account
        - section-{{ section.id }}-padding
        - page-width
        - customer__title
        - order-history
        - pagination
        - svg-wrapper
        - visually-hidden
      data_attributes:
        - data-label
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - Section-specific padding values (padding_top, padding_bottom)
      - Section color scheme setting
      - Pagination state for customer orders
    common_mistakes:
      - Forgetting this file depends on customer being logged in and will not render for guest users
      - Not recognizing the paginate object wraps the customer.orders loop and limits to 20 orders per page
      - Modifying table structure without updating ARIA roles and headers relationships
      - Changing pagination without accounting for the conditional rendering when paginate.pages > 1
    fix_guidance: Check customer.css for styling issues, verify section settings schema for
      padding_top/padding_bottom/color_scheme settings, and ensure localization keys in en.default.json exist for all
      translation strings used
  - file: sections/activate-account.liquid
    responsibility: Renders the customer account activation form where new customers set their password for the first time
    owns:
      - Customer account activation form with password and password confirmation fields
      - Form validation error display for activation failures
      - Submit and decline buttons for account activation
      - Responsive padding configuration via section settings
    depends_on:
      js: []
      snippets: []
      sections: []
      global_objects:
        - form (Shopify form object for activate_customer_password)
        - section.id
        - section.settings.padding_top
        - section.settings.padding_bottom
      custom_elements: []
    depended_on_by:
      - templates/customers/activate_account.json
    key_identifiers:
      css_classes:
        - customer
        - activate
        - section-{{ section.id }}-padding
        - field
        - form__message
        - svg-wrapper
      data_attributes: []
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - Form validation state through Shopify form object
      - Password and password confirmation input values
    common_mistakes:
      - Confusing this with login.liquid or reset-password.liquid (this is specifically for first-time account
        activation)
      - Not recognizing that this form uses the special 'activate_customer_password' form type
      - Modifying form field names which must match Shopify's expected customer[password] and
        customer[password_confirmation] format
      - Assuming JavaScript validation exists when validation is server-side only through Shopify form object
    fix_guidance: Check customer.css for styling issues; verify translation keys in locales/en.default.json for text
      content; ensure form.errors object structure matches Shopify's customer activation form error format
  - file: sections/addresses.liquid
    responsibility: Renders the customer address management page allowing users to view, add, edit, and delete
      shipping/billing addresses
    owns:
      - Address list display with pagination (5 addresses per page)
      - Add new address form with country/province dropdowns
      - Edit existing address forms (one per saved address)
      - Delete address functionality with confirmation
      - Default address designation toggle
      - Navigation back to customer account page
    depends_on:
      js:
        - assets/shopify.js
        - assets/customer.js
      snippets: []
      sections: []
      global_objects:
        - customer
        - customer.addresses
        - customer.new_address
        - customer.default_address
        - routes.account_url
        - all_country_option_tags
      custom_elements: []
    depended_on_by:
      - templates/customers/addresses.json
    key_identifiers:
      css_classes:
        - customer
        - addresses
        - section-{{ section.id }}-padding
        - field
        - select
        - svg-wrapper
      data_attributes:
        - data-customer-addresses
        - data-address
        - data-address-id
        - data-default
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - Customer address form visibility toggle (expanded/collapsed)
      - Address form validation states
      - Active address being edited (via data-address-id)
      - Province/state dropdown visibility based on selected country
    common_mistakes:
      - Forgetting that address forms are dynamically shown/hidden via JavaScript in customer.js
      - Not understanding that country/province dropdowns use Shopify's native address helpers (all_country_option_tags)
      - Assuming address deletion is handled in this file when it's actually processed server-side via form submission
      - Missing that pagination limit is hardcoded to 5 addresses per page
      - Modifying form field names which breaks Shopify's customer_address form handler
    fix_guidance: Check customer.js for address form toggle logic and form validation; verify section schema settings for
      padding values; ensure customer.addresses liquid object is populated (customer must be logged in); check
      locales/en.default.json for missing translation keys under customer.addresses namespace
  - file: sections/animated-features-v2.liquid
