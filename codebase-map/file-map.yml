        - assets/section-animated-features-v2.js
      css:
        - assets/section-animated-features-v2.css
      snippets: []
      sections: []
      global_objects:
        - section.settings
        - section.id
      custom_elements:
        - animated-features-v2
      icons:
        - icon-checkmark.svg
    depended_on_by:
      - templates/page.animated-features-v2.json
    key_identifiers:
      css_classes:
        - animated-features-v2
        - animated-features-v2__container
        - animated-features-v2__left
        - animated-features-v2__right
        - animated-features-v2__image-wrapper
        - animated-features-v2__image
        - animated-features-v2__image-placeholder
        - animated-features-v2__image-label
        - animated-features-v2__heading
        - animated-features-v2__subheading
        - animated-features-v2__features
