        - template-404
        - page-width
        - title
        - button
      data_attributes: []
      js_events_emitted: []
      js_events_listened: []
      custom_elements: []
    state_ownership:
      - none
    common_mistakes:
      - Assuming this file handles routing logic when it only renders the error page UI
      - Modifying hardcoded color values without considering the color_scheme setting
      - Breaking translation keys (templates.404.subtext, templates.404.title, general.continue_shopping)
      - Not testing responsive breakpoint at 768px when making style changes
    fix_guidance: Check locales/en.default.json for missing translation keys if text not displaying; verify
      routes.all_products_collection_url is valid; inspect color-scheme-* CSS classes if colors incorrect
  - file: sections/Faq-metaobjects.liquid
    responsibility: Renders an accordion-style FAQ section populated from Shopify metaobjects of type faq_item with dynamic
      padding and color scheme support
    owns:
      - FAQ accordion UI with expand/collapse functionality using Alpine.js
      - Metaobject-based FAQ data rendering (question/answer pairs)
      - Empty state setup instructions visible only in theme editor
      - Section-specific responsive padding styles
      - Plus/minus icon toggle indicators
    depends_on:
      js:
        - assets/alpinejs@3.14.8.min.js
      snippets: []
      sections: []
      global_objects:
        - section.settings.faq_items
        - section.settings.title
        - section.settings.color_scheme
        - section.settings.padding_top
        - section.settings.padding_bottom
        - request.design_mode
      custom_elements: []
      assets:
        - section-faq.css
        - icon-plus.svg
        - icon-minus.svg
    depended_on_by:
      - templates/*.json (can be included via theme editor)
      - Content > Metaobjects > faq_item definition
    key_identifiers:
      css_classes:
        - faq-section
        - faq__heading
        - faq__container
        - faq__block
        - faq__accordion
        - faq__header
        - faq__title
        - faq__icon
        - faq__content
        - faq__content-wrapper
        - faq__answer
        - faq__setup-notice
        - faq__setup-notice-inner
        - faq__setup-notice-title
        - faq__setup-steps
        - faq__setup-notice-hint
        - section-{{ section.id }}-padding
        - color-{{ section.settings.color_scheme }}
      data_attributes: []
      js_events_emitted: []
      js_events_listened:
        - "@click (Alpine.js accordion toggle)"
      alpine_directives:
        - x-data (openBlock state)
        - x-show (conditional icon/content display)
        - x-transition (smooth expand/collapse)
        - x-cloak (prevent flash of unstyled content)
        - "@click (button toggle handler)"
        - :aria-expanded (dynamic accessibility attribute)
    state_ownership:
      - openBlock (Alpine.js local state tracking which FAQ accordion is open, null or index number)
    common_mistakes:
      - Assuming faq_items is an array of simple objects instead of metaobject drops requiring .question and .answer
        field access
      - Forgetting that metaobject_list can be empty/null if merchant hasn't configured metaobjects yet
      - Not understanding that empty state (faq__setup-notice) only renders when request.design_mode is true AND
        faq_items is blank
      - Modifying Alpine.js state variable names without updating all @click and x-show bindings consistently
      - Expecting answer text to have HTML formatting when it's a multi_line_text_field that requires newline_to_br
        filter
      - Breaking responsive padding by modifying section.id which is used in dynamic style tag
    fix_guidance: Check that faq_item metaobject definition exists in Shopify Admin with question and answer fields; verify
      Alpine.js is loaded; inspect openBlock state in browser devtools; ensure section-faq.css contains all faq__* class
      styles; validate metaobject_list setting returns expected data structure
  - file: sections/Faq.liquid
    responsibility: Renders an accordion-style FAQ section with expandable question/answer blocks using Alpine.js
    owns:
      - FAQ section layout and accordion UI
      - Alpine.js state management for accordion expansion (openBlock)
      - Dynamic inline styles for section padding
      - Question/answer block rendering from section blocks
      - Icon toggle display (plus/minus) based on accordion state
    depends_on:
      js:
        - assets/alpinejs@3.14.8.min.js
      snippets: []
      sections: []
      global_objects:
        - section (Shopify section object)
        - block (Shopify block iterator)
      custom_elements: []
      css:
        - assets/section-faq.css
      icons:
        - icon-plus.svg
        - icon-minus.svg
    depended_on_by:
      - templates/*.json (any template that includes FAQ section)
    key_identifiers:
      css_classes:
        - faq-section
        - faq__heading
        - faq__container
        - faq__block
        - faq__accordion
        - faq__header
        - faq__title
        - faq__icon
        - faq__content
        - faq__content-wrapper
        - faq__answer
        - section-{{ section.id }}-padding
        - color-{{ section.settings.color_scheme }}
      data_attributes:
        - x-data="{ openBlock: null }"
        - x-show
        - x-transition
        - x-cloak
        - "@click"
        - :aria-expanded
      js_events_emitted: []
      js_events_listened:
        - click (via Alpine.js @click directive)
      custom_elements: []
    state_ownership:
      - openBlock (Alpine.js reactive state tracking which accordion item is open, null when all closed)
    common_mistakes:
      - Forgetting that Alpine.js must be loaded for accordion functionality to work
      - Not understanding that openBlock uses forloop.index0 (zero-based) for comparison
      - Modifying x-data structure without updating all x-show and @click references
      - Removing x-cloak without understanding it prevents flash of unstyled content
      - Not realizing section-faq.css is required for proper styling
    fix_guidance: Check that Alpine.js is loaded in theme.liquid, verify section-faq.css exists and is properly styled,
      ensure forloop.index0 values are consistent across button click handler and conditional displays
  - file: sections/account.liquid
