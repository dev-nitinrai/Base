      snippets: []
      sections: []
      global_objects:
        - customer.addresses
        - customer.new_address
        - customer.default_address
        - routes.account_url
        - all_country_option_tags
        - paginate
      custom_elements: []
    depended_on_by:
      - templates/customers/addresses.json
    key_identifiers:
      css_classes:
        - customer
        - addresses
        - section-{{ section.id }}-padding
        - field
        - select
        - svg-wrapper
      data_attributes:
        - data-customer-addresses
        - data-address
        - data-address-id
        - data-default
      js_events_emitted: []
      js_events_listened:
        - aria-expanded toggles for showing/hiding address forms
        - country/province dropdown changes (handled by customer.js)
      custom_elements: []
    state_ownership:
      - Form visibility state for add/edit address forms (via aria-expanded)
      - Current country selection affects province dropdown visibility and options
      - Pagination state for address list
    common_mistakes:
      - Forgetting that country/province dropdowns are dynamically linked and require customer.js
      - Not realizing forms use Shopify form objects (customer_address) not standard HTML forms
      - Assuming all addresses are shown at once (they're paginated by 5)
      - Modifying form field IDs without updating corresponding label for attributes
      - Breaking the AddressCountryNew/AddressProvinceNew naming convention that customer.js depends on
    fix_guidance: Check customer.js for form toggle and country/province logic; verify form objects are properly scoped to
      customer.addresses; ensure pagination limit matches expected UI behavior
  - file: sections/animated-features-v2.liquid
