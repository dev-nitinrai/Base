        - animated-features
        - animated-features__container
        - animated-features__left
        - animated-features__right
        - animated-features__grid
        - animated-features__card
        - animated-features__card-inner
        - animated-features__card-front
        - animated-features__card-back
        - animated-features__heading
        - animated-features__subheading
        - animated-features__button
        - animated-features__notes
        - animated-features__icon
        - animated-features__image
        - animated-features__label
        - animated-features__flipped-text
