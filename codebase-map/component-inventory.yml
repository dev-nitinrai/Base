      - id: padding_bottom
        type: range
        label: Padding Bottom
    blocks:
      - type: faq_item
        name: FAQ Item
        settings:
          - question
          - answer
    max_blocks: null
    templates_allowed:
      - "*"
    presets:
      - FAQ
    uses_image: false
    uses_video: false
    uses_slider: false
    uses_grid: false
    uses_tabs: false
    uses_accordion: true
    uses_form: false
    layout_type: block
    mockup_keywords:
      - faq-accordion
      - collapsible-content
      - expandable-list
      - question-answer
      - accordion-section
      - toggle-content
      - plus-minus-icons
      - faq-list
    when_to_use: When mockup shows a vertically stacked list of questions that expand/collapse to reveal answers with
      plus/minus toggle icons
    when_to_create_new: When mockup requires multi-column FAQ layout, tabbed categories, search functionality, or
      non-accordion display patterns like always-visible answers
    requires_new_section_if:
      - FAQ items need to be organized in multiple columns or grid layout
      - Requires category tabs or filtering to organize questions by topic
      - Needs search or filter functionality to find specific questions
      - Questions should display in a table format or non-collapsible layout
      - Requires icons or images alongside each question
      - Needs pagination or 'load more' functionality for many items
      - Requires multiple answer formats (text, video, images) within single items
      - Needs nested accordions or sub-questions within answers
    similar_sections:
      - Collapsible-content.liquid
      - Accordion.liquid
      - Collapsible-tabs.liquid
      - Product-tabs.liquid
