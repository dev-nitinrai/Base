      - customer onboarding
      - form with decline option
      - centered account form
      - password confirmation layout
      - customer authentication
    when_to_use: Use this section when a design shows a customer account activation flow with password and password
      confirmation fields plus submit/cancel actions.
    when_to_create_new: Create a new section if the activation flow requires additional fields beyond password/confirmation,
      multi-step onboarding, email verification UI, or terms acceptance checkboxes.
    requires_new_section_if:
      - Additional input fields beyond password and password confirmation are needed
      - Multi-step activation wizard or progress indicator is required
      - Email verification or code entry interface is part of activation
      - Terms of service or privacy policy checkboxes must be included
      - Social login or OAuth integration is part of the activation flow
      - Profile information collection during activation is required
