      - account-overview
      - logged-in-portal
      - customer-profile
      - order-list
      - account-header
      - data-table
      - pagination-view
      - account-logout
    when_to_use: When the mockup shows a customer account dashboard with order history table and logout functionality for
      logged-in users.
    when_to_create_new: When the mockup requires additional account features like address management, saved payment methods,
      wishlists, or a completely different layout beyond order history.
    requires_new_section_if:
      - Displaying customer addresses or address management UI
      - Showing saved payment methods or wallet features
      - Including wishlist or favorites display
      - Requiring customer profile edit forms within the section
      - Needing order filtering, sorting, or search functionality
      - Displaying loyalty points, rewards, or subscription management
      - Using cards or grid layout instead of table format for orders
      - Including customer analytics or spending insights
