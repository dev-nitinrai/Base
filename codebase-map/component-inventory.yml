sections:
  - file: sections/404.liquid
    name: "404"
    label: "404"
    visual_role: 404 section
    settings:
      - id: color_scheme
        type: color_scheme
        label: t:sections.all.colors.label
    blocks: []
    max_blocks: null
    templates_allowed:
      - "*"
    presets: []
    uses_image: false
    uses_video: false
    uses_slider: false
    uses_grid: false
    uses_tabs: false
    uses_accordion: false
    uses_form: false
    layout_type: block
    mockup_keywords:
      - 404 error page
      - page not found
      - centered message
      - error state
      - single CTA
      - centered layout
      - minimal error page
      - empty state
    when_to_use: Use this section when you need a standard 404 error page with centered text and a single call-to-action
      button to redirect users back to shopping.
    when_to_create_new: Create a new section if the mockup requires multiple CTAs, search functionality, product
      recommendations, custom illustrations, multi-column layouts, or navigation elements beyond a single button.
    requires_new_section_if:
      - Multiple call-to-action buttons with different destinations
      - Search bar or search suggestions
      - Product recommendations or featured collections
      - Custom image or illustration upload
      - Multiple text blocks or customizable content areas
      - Navigation links or sitemap display
      - Editable title and description text via settings
      - Layout variations (left-aligned, split-screen, etc.)
      - Background image or video support
      - Social media links or contact information
    similar_sections:
      - password.liquid
      - contact.liquid
      - page.liquid
  - file: sections/Faq.liquid
    name: Faq
    label: FAQ
    visual_role: FAQ section
    settings:
      - id: title
        type: text
        label: Heading
      - id: color_scheme
        type: color_scheme
        label: t:sections.all.colors.label
      - type: header
      - id: padding_top
        type: range
        label: Padding Top
      - id: padding_bottom
        type: range
        label: Padding Bottom
    blocks:
      - type: faq_item
        name: FAQ Item
        settings:
          - question
          - answer
    max_blocks: null
    templates_allowed:
      - "*"
    presets:
      - FAQ
    uses_image: false
    uses_video: false
    uses_slider: false
    uses_grid: false
    uses_tabs: false
    uses_accordion: true
    uses_form: false
    layout_type: block
    mockup_keywords:
      - faq-accordion
      - collapsible-faq
      - expandable-list
      - q-and-a
      - accordion-menu
      - help-section
      - frequently-asked-questions
      - toggle-content
    when_to_use: Use this section when the mockup shows a vertically stacked list of questions that expand/collapse to
      reveal answers with plus/minus icons.
    when_to_create_new: Create a new section if the mockup requires multi-column FAQ layout, categorized/tabbed FAQs, search
      functionality, or alternative expand/collapse patterns like side-by-side or card-based layouts.
    requires_new_section_if:
      - FAQ items need to be displayed in multiple columns or grid layout
      - Categories or tabs are needed to organize FAQ groups
      - Search or filter functionality is required
      - Questions and answers need to be displayed side-by-side instead of stacked
      - Card-based or boxed styling for each FAQ item is required
      - Icons or images need to accompany each question
      - Multiple FAQs need to be open simultaneously by default
      - Rich media (video, images) needs to be embedded within answers
    similar_sections:
      - Collapsible-content.liquid
      - Accordion.liquid
      - Collapsible-tabs.liquid
