sections:
  - file: sections/404.liquid
    name: "404"
    label: "404"
    visual_role: 404 section
    settings:
      - id: color_scheme
        type: color_scheme
        label: t:sections.all.colors.label
    blocks: []
    max_blocks: null
    templates_allowed:
      - "*"
    presets: []
    uses_image: false
    uses_video: false
    uses_slider: false
    uses_grid: false
    uses_tabs: false
    uses_accordion: false
    uses_form: false
    layout_type: block
    mockup_keywords:
      - 404 page
      - error page
      - not found
      - centered text layout
      - single CTA button
      - empty state
      - page not found
      - centered message
    when_to_use: When you need a simple centered error page with a heading, subtext, and a single call-to-action button
      directing users back to shopping.
    when_to_create_new: When the mockup requires multiple CTAs, search functionality, product recommendations, navigation
      links, images/illustrations, or a different layout structure beyond centered vertical text.
    requires_new_section_if:
      - Multiple call-to-action buttons with different destinations
      - Search bar or search suggestions
      - Product recommendations or collections grid
      - Custom illustration or hero image
      - Navigation menu or sitemap links
      - Multi-column layout
      - Background image or video
      - Different text alignment (left/right)
      - Custom form elements
    similar_sections:
      - password.liquid
      - empty-state templates
      - thank-you pages
      - coming-soon pages
  - file: sections/Faq.liquid
    name: Faq
    label: FAQ
    visual_role: FAQ section
    settings:
      - id: title
        type: text
        label: Heading
      - id: color_scheme
        type: color_scheme
        label: t:sections.all.colors.label
      - type: header
      - id: padding_top
        type: range
        label: Padding Top
      - id: padding_bottom
        type: range
        label: Padding Bottom
    blocks:
      - type: faq_item
        name: FAQ Item
        settings:
          - question
          - answer
    max_blocks: null
    templates_allowed:
      - "*"
    presets:
      - FAQ
    uses_image: false
    uses_video: false
    uses_slider: false
    uses_grid: false
    uses_tabs: false
    uses_accordion: true
    uses_form: false
    layout_type: block
    mockup_keywords:
      - faq-accordion
      - collapsible-content
      - expandable-list
      - question-answer
      - accordion-panel
      - toggle-content
      - plus-minus-icons
      - interactive-faq
    when_to_use: When mockup shows a vertically stacked list of questions that expand/collapse to reveal answers with
      plus/minus toggle icons.
    when_to_create_new: When mockup requires multi-column FAQ layout, category tabs, search functionality, or always-visible
      answers without accordion behavior.
    requires_new_section_if:
      - FAQ items grouped into multiple columns or grid layout
      - Category filtering or tabbed navigation between FAQ groups
      - Search or filter functionality for questions
      - Multiple FAQs open simultaneously by default
      - Media content (images/videos) within answers requiring image blocks
      - Side-by-side layout with questions on left and answers on right
      - Different icon sets or custom animations beyond plus/minus toggle
      - Nested accordions or sub-questions within answers
    similar_sections:
      - Collapsible-content.liquid
      - Accordion.liquid
      - Product-tabs.liquid
      - Text-columns-with-icons.liquid
