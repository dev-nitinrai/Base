sections:
  - file: sections/404.liquid
    name: "404"
    label: "404"
    visual_role: 404 section
    settings:
      - id: color_scheme
        type: color_scheme
        label: t:sections.all.colors.label
    blocks: []
    max_blocks: null
    templates_allowed:
      - "*"
    presets: []
    uses_image: false
    uses_video: false
    uses_slider: false
    uses_grid: false
    uses_tabs: false
    uses_accordion: false
    uses_form: false
    layout_type: block
    mockup_keywords:
      - 404 error page
      - page not found
      - error state
      - centered text layout
      - call-to-action button
      - minimal error page
      - full-width centered content
      - error message
    when_to_use: When a designer shows a simple centered 404 error page with a heading, subtext, and a single call-to-action
      button to continue shopping.
    when_to_create_new: When the mockup requires multiple CTAs, search functionality, product recommendations,
      image/illustration assets, multi-column layout, or custom navigation elements beyond a single continue shopping
      link.
    requires_new_section_if:
      - Multiple call-to-action buttons with different destinations
      - Search bar or product search functionality
      - Product recommendations or related products grid
      - Custom illustrations or imagery requirements
      - Multi-column layout with additional navigation options
      - Breadcrumb navigation or sitemap links
      - Social media links or contact information
      - Custom icon elements or decorative graphics
    similar_sections:
      - coming-soon
      - password
      - contact-form
  - file: sections/Faq-metaobjects.liquid
    name: Faq-metaobjects
    label: FAQ — Metaobjects
    visual_role: FAQ — Metaobjects section
    settings:
      - id: title
        type: text
        label: Heading
      - id: faq_items
        type: metaobject_list
        label: FAQ Items
      - id: color_scheme
        type: color_scheme
        label: t:sections.all.colors.label
      - type: header
      - id: padding_top
        type: range
        label: Padding top
      - id: padding_bottom
        type: range
        label: Padding bottom
    blocks: []
    max_blocks: null
    templates_allowed:
      - "*"
    presets:
      - FAQ — Metaobjects
    uses_image: false
    uses_video: false
    uses_slider: false
    uses_grid: false
    uses_tabs: false
    uses_accordion: true
    uses_form: false
    layout_type: block
    mockup_keywords:
      - faq-accordion
      - collapsible-faq
      - accordion-list
      - expandable-questions
      - metaobject-faq
      - q&a-section
      - faq-dropdown
      - single-column-accordion
    when_to_use: When the mockup shows a vertical list of expandable question/answer pairs powered by metaobjects with
      plus/minus icons and optional section title.
    when_to_create_new: When the mockup requires multi-column FAQ layout, categorized/tabbed FAQs, search functionality,
      rich media in answers, or FAQ data not from metaobjects.
    requires_new_section_if:
      - FAQ items need to be organized into multiple columns or tabs/categories
      - Answers require rich text editor content, images, videos, or embedded media
      - Search or filter functionality is needed across FAQ items
      - FAQ data comes from product metafields, blog posts, or static blocks instead of metaobjects
      - Multiple accordion styles or layouts need to coexist in one section
      - Schema editor questions/answers are required instead of metaobject references
      - Icons other than plus/minus are needed or custom per-item icons
      - Side-by-side layout with image or illustration alongside questions
    similar_sections:
      - faq.liquid
      - accordion.liquid
      - collapsible-content.liquid
      - faq-blocks.liquid
      - help-center.liquid
  - file: sections/Faq.liquid
    name: Faq
    label: FAQ
    visual_role: FAQ section
    settings:
      - id: title
        type: text
        label: Heading
