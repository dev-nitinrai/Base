    uses_video: false
    uses_slider: false
    uses_grid: true
    uses_tabs: false
    uses_accordion: false
    uses_form: false
    layout_type: block
    mockup_keywords:
      - customer-account-dashboard
      - order-history-table
      - account-overview
      - logged-in-user-page
      - transaction-list
      - customer-portal
      - account-header-logout
      - paginated-orders
    when_to_use: When the mockup shows a logged-in customer's account page with order history table and logout functionality
    when_to_create_new: When the mockup requires additional customer data sections like address book, wishlist, subscription
      management, or loyalty points that go beyond basic order history
    requires_new_section_if:
      - Mockup includes saved addresses or address management UI
      - Design shows customer profile editing fields beyond orders
      - Layout includes wishlist or saved items display
      - Mockup requires subscription or recurring order management
      - Design shows loyalty points, rewards, or referral program
      - Layout includes order filtering, searching, or advanced sorting beyond pagination
      - Mockup shows order details inline without linking to separate page
      - Design requires multiple tabs or navigation within account area
    similar_sections:
      - login.liquid
      - order.liquid
      - account-addresses.liquid
      - customer.liquid
