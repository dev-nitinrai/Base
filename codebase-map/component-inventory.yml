      with icons and images on the right, especially with animation requirements.
    when_to_create_new: When the design requires a different grid layout (not 2x2), non-flip card interactions, more than 4
      features, or different content structure beyond image/label/flipped-text per card.
    requires_new_section_if:
      - More or fewer than 4 feature cards needed
      - Grid layout other than 2x2 (e.g., 3-column, single row, 3x3)
      - Card interaction other than flip animation (e.g., slide, expand, modal)
      - Multiple images or complex content per card beyond single image and two text fields
      - No split layout or full-width card grid without left sidebar
      - Video content instead of static images
      - Cards need individual CTA buttons or links
      - Dynamic/collection-based cards rather than fixed 4 cards
