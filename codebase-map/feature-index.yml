features:
  - name: Password Protected Storefront
    description: Displays a locked storefront page with login form and branding when the store is password protected
    primary_files:
      - layout/password.liquid
      - sections/password.liquid
    secondary_files:
      - templates/password.json
      - snippets/meta-tags.liquid
      - snippets/css-variables.liquid
      - assets/critical.css
    do_not_edit:
      - templates/password.json
    entry_point: layout/password.liquid
  - name: Main Theme Layout
    description: Global HTML document structure, asset loading, and section orchestration for all non-password pages
    primary_files:
      - layout/theme.liquid
    secondary_files:
      - snippets/meta-tags.liquid
      - snippets/css-variables.liquid
      - snippets/component-gtm-head.liquid
      - snippets/component-gtm-body.liquid
      - snippets/component-splash-screen-head.liquid
      - snippets/component-splash-screen.liquid
      - snippets/component-data-layer.liquid
      - assets/critical.css
      - assets/theme.js
      - config/settings_data.json
    do_not_edit:
      - assets/critical.css
    entry_point: layout/theme.liquid
  - name: 404 Error Page
    description: Displays a styled not-found error message with a continue shopping button
    primary_files:
      - sections/404.liquid
    secondary_files:
      - templates/404.json
    do_not_edit:
      - templates/404.json
    entry_point: templates/404.json
  - name: FAQ Section (Metaobjects)
    description: Accordion-style FAQ populated from Shopify metaobjects of type faq_item
    primary_files:
      - sections/Faq-metaobjects.liquid
    secondary_files:
      - assets/section-faq.css
    do_not_edit: []
    entry_point: sections/Faq-metaobjects.liquid
  - name: FAQ Section (Static)
    description: Accordion-style FAQ with expandable question/answer blocks using Alpine.js
    primary_files:
      - sections/Faq.liquid
    secondary_files:
      - assets/section-faq.css
    do_not_edit: []
    entry_point: sections/Faq.liquid
  - name: Customer Account Dashboard
    description: Shows order history and account navigation for logged-in customers
    primary_files:
      - sections/account.liquid
    secondary_files:
      - templates/customers/account.json
      - assets/customer.css
    do_not_edit:
      - templates/customers/account.json
    entry_point: templates/customers/account.json
  - name: Customer Account Activation
    description: Form for new customers to set their password for the first time
    primary_files:
      - sections/activate-account.liquid
    secondary_files:
      - templates/customers/activate_account.json
      - assets/customer.css
    do_not_edit:
      - templates/customers/activate_account.json
    entry_point: templates/customers/activate_account.json
  - name: Customer Address Management
    description: Page for adding, editing, and deleting saved shipping addresses
    primary_files:
      - sections/addresses.liquid
    secondary_files:
      - templates/customers/addresses.json
      - assets/customer.css
      - assets/customer.js
      - assets/shopify.js
    do_not_edit:
      - templates/customers/addresses.json
    entry_point: templates/customers/addresses.json
  - name: Animated Features Section V2
    description: Animated section with percentage heading, feature checklist, and image with scroll-triggered animations
    primary_files:
      - sections/animated-features-v2.liquid
      - assets/section-animated-features-v2.js
    secondary_files:
      - assets/section-animated-features-v2.css
    do_not_edit: []
    entry_point: sections/animated-features-v2.liquid
  - name: Animated Features Section
    description: Animated section with left content and right grid of flippable cards
    primary_files:
      - sections/animated-features.liquid
      - assets/section-animated-features.js
    secondary_files:
      - assets/section-animated-features.css
    do_not_edit: []
    entry_point: sections/animated-features.liquid
  - name: Announcement Bar
    description: Rotating auto-scrolling announcement bar with customizable messages, links, and emojis
    primary_files:
      - sections/announcement-bar.liquid
    secondary_files:
      - sections/header-group.json
    do_not_edit:
      - sections/header-group.json
    entry_point: sections/announcement-bar.liquid
  - name: Blog Article Page
    description: Individual blog article layout with featured image, title, content, sharing, and navigation
    primary_files:
      - sections/article.liquid
    secondary_files:
      - templates/article.json
      - assets/section-article.css
      - snippets/component-product-share-button.liquid
      - assets/component-product-share-button.js
      - assets/component-product-share-button.css
    do_not_edit:
      - templates/article.json
    entry_point: templates/article.json
  - name: Blog Listing Page
    description: Main blog listing with pagination and configurable article card layout
    primary_files:
      - sections/blog.liquid
    secondary_files:
      - templates/blog.json
      - assets/section-blog.css
      - snippets/component-article-card.liquid
      - assets/component-article-card.css
      - snippets/component-pagination.liquid
      - assets/component-pagination.css
    do_not_edit:
      - templates/blog.json
    entry_point: templates/blog.json
  - name: Blog Articles Grid Section
    description: Grid display of blog articles with heading, navigation link, and configurable article blocks
    primary_files:
      - sections/blogs.liquid
    secondary_files:
      - assets/section-blogs.css
      - snippets/component-article-card.liquid
      - assets/component-article-card.css
    do_not_edit: []
    entry_point: sections/blogs.liquid
  - name: Brand Story Section V2
    description: Interactive accordion brand story with clickable items displaying corresponding images
    primary_files:
      - sections/brand-story-v2.liquid
      - assets/section-brand-story-v2.js
    secondary_files:
      - assets/section-brand-story-v2.css
    do_not_edit: []
    entry_point: sections/brand-story-v2.liquid
  - name: Brand Story Section
    description: Side-by-side image comparison and text content brand story section
    primary_files:
      - sections/brand-story.liquid
    secondary_files:
      - assets/section-brand-story.css
    do_not_edit: []
    entry_point: sections/brand-story.liquid
  - name: Cart Page
    description: Main cart page with line items, quantity controls, discount codes, and checkout
    primary_files:
      - sections/cart.liquid
    secondary_files:
      - templates/cart.json
      - assets/cart.css
      - snippets/component-cart-discount.liquid
      - assets/component-cart-discount.js
    do_not_edit:
      - templates/cart.json
    entry_point: templates/cart.json
  - name: Cart Drawer
    description: Slide-out cart drawer that opens when products are added to cart via AJAX
    primary_files:
      - snippets/component-cart-drawer.liquid
      - assets/component-cart-drawer.js
    secondary_files:
      - assets/cart.css
      - snippets/component-cart-discount.liquid
      - assets/component-cart-discount.js
    do_not_edit: []
    entry_point: snippets/component-cart-drawer.
