# =============================================================================
# FAQ Metaobjects — Setup Script
# =============================================================================
#
# Run these mutations in order using the Shopify GraphQL Admin API:
#   Shopify Admin → Apps → (any app with Admin API access) → GraphQL Explorer
#   OR via the Shopify CLI:  shopify app graphiql
#
# API version: 2024-01 or later
# Required scope: write_metaobject_definitions, write_metaobjects
#
# Steps:
#   1. Run "STEP 1" mutation to create the faq_item metaobject definition.
#   2. Run "STEP 2a", "STEP 2b", "STEP 2c" to seed the three sample entries.
#   3. In the Shopify admin theme editor, open the "FAQ — Metaobjects" section
#      and pick the three entries from the "FAQ Items" setting.
# =============================================================================


# -----------------------------------------------------------------------------
# STEP 1 — Create the faq_item metaobject definition
# Run this ONCE.  If the definition already exists you will get a userError
# with code TAKEN — that's fine, just skip to Step 2.
# -----------------------------------------------------------------------------
mutation CreateFaqItemDefinition {
  metaobjectDefinitionCreate(
    definition: {
      type: "faq_item"
      name: "FAQ Item"
      displayNameKey: "question"
      access: {
        # PUBLIC_READ lets the Storefront API (and Liquid) read entries.
        storefront: PUBLIC_READ
      }
      fieldDefinitions: [
        {
          name: "Question"
          key: "question"
          type: "single_line_text_field"
          required: true
          validations: [
            { name: "min", value: "5" }
            { name: "max", value: "300" }
          ]
        }
        {
          name: "Answer"
          key: "answer"
          type: "multi_line_text_field"
          required: true
          validations: [
            { name: "min", value: "10" }
            { name: "max", value: "2000" }
          ]
        }
      ]
    }
  ) {
    metaobjectDefinition {
      id
      type
      name
      fieldDefinitions {
        key
        name
        type {
          name
        }
      }
    }
    userErrors {
      field
      message
      code
    }
  }
}


# -----------------------------------------------------------------------------
# STEP 2a — Sample entry: Shipping
# -----------------------------------------------------------------------------
mutation CreateFaqShipping {
  metaobjectCreate(
    metaobject: {
      type: "faq_item"
      handle: "faq-shipping"
      fields: [
        {
          key: "question"
          value: "How long does shipping take?"
        }
        {
          key: "answer"
          value: "Standard shipping takes 5\u20137 business days after your order is processed.\n\nExpress shipping (2\u20133 business days) is available at checkout for an additional fee.\n\nFree standard shipping is included on all orders over $75."
        }
      ]
    }
  ) {
    metaobject {
      id
      handle
      fields {
        key
        value
      }
    }
    userErrors {
      field
      message
      code
    }
  }
}


# -----------------------------------------------------------------------------
# STEP 2b — Sample entry: Returns
# -----------------------------------------------------------------------------
mutation CreateFaqReturns {
  metaobjectCreate(
    metaobject: {
      type: "faq_item"
      handle: "faq-returns"
      fields: [
        {
          key: "question"
          value: "What is your return policy?"
        }
        {
          key: "answer"
          value: "We accept returns within 30 days of delivery.\n\nItems must be unworn, unwashed, and in their original packaging with all tags still attached.\n\nTo start a return, email returns@yourstore.com with your order number and reason. We will send a prepaid return label within 1 business day."
        }
      ]
    }
  ) {
    metaobject {
      id
      handle
      fields {
        key
        value
      }
    }
    userErrors {
      field
      message
      code
    }
  }
}


# -----------------------------------------------------------------------------
# STEP 2c — Sample entry: Sizing
# -----------------------------------------------------------------------------
mutation CreateFaqSizing {
  metaobjectCreate(
    metaobject: {
      type: "faq_item"
      handle: "faq-sizing"
      fields: [
        {
          key: "question"
          value: "How do I find the right size?"
        }
        {
          key: "answer"
          value: "We recommend measuring yourself (chest, waist, hips) and comparing against our size chart, which you can find on every product page.\n\nIf you are between two sizes, size up for a relaxed fit or size down for a snug fit.\n\nStill unsure? Contact our support team with your measurements and we will help you find the perfect fit."
        }
      ]
    }
  ) {
    metaobject {
      id
      handle
      fields {
        key
        value
      }
    }
    userErrors {
      field
      message
      code
    }
  }
}


# =============================================================================
# Optional — Query all faq_item entries to confirm seeding worked
# =============================================================================
query ListFaqItems {
  metaobjects(type: "faq_item", first: 10) {
    edges {
      node {
        id
        handle
        field(key: "question") { value }
        field(key: "answer")   { value }
      }
    }
  }
}
